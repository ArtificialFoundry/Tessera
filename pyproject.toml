[project]
name = "tessera"
version = "0.1.0"
description = "DHCP management and failover platform for Technitium DNS Server."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7",
    "httpx>=0.28,<1",
    "croniter>=6.0,<7",
    "jinja2>=3.1",
    "python-json-logger>=3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-croniter>=6.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM",
    "TCH", "RUF", "PTH", "RET", "ARG", "ERA", "TID",
]

[tool.ruff.lint.per-file-ignores]
"src/tessera/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["tessera"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = ["slow: marks tests as slow"]
