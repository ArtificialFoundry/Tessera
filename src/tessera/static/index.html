<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tessera — DHCP Management</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  --text: #e8e8ed;
  --text-dim: #8888a0;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.3);
  --green: #22c55e;
  --green-glow: rgba(34,197,94,0.3);
  --red: #ef4444;
  --red-glow: rgba(239,68,68,0.3);
  --yellow: #eab308;
  --yellow-glow: rgba(234,179,8,0.3);
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --radius: 16px;
  --blur: 20px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f0f5;
    --surface: rgba(0,0,0,0.03);
    --surface-hover: rgba(0,0,0,0.06);
    --border: rgba(0,0,0,0.08);
    --text: #1a1a2e;
    --text-dim: #666680;
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

.orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; }
.orb-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -100px; }
.orb-2 { width: 500px; height: 500px; background: var(--green); bottom: -150px; right: -100px; }
.orb-3 { width: 400px; height: 400px; background: #ec4899; top: 50%; left: 60%; }

.app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px; }

.nav {
  display: flex; align-items: center; gap: 24px; margin-bottom: 32px; padding: 16px 24px;
  background: var(--surface); backdrop-filter: blur(var(--blur)); border: 1px solid var(--border); border-radius: var(--radius);
}
.nav-brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--accent), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav-tabs { display: flex; gap: 8px; margin-left: auto; }
.nav-tab { padding: 8px 20px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.nav-tab:hover { color: var(--text); background: var(--surface-hover); }
.nav-tab.active { color: var(--text); background: var(--surface); border-color: var(--border); }

.card { background: var(--surface); backdrop-filter: blur(var(--blur)); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; transition: all 0.2s; }
.card:hover { border-color: rgba(255,255,255,0.12); }

.metrics-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.metric { text-align: center; padding: 20px 16px; }
.metric-value { font-size: 32px; font-weight: 700; font-family: var(--mono); line-height: 1; }
.metric-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }

.hero { text-align: center; padding: 48px 24px; margin-bottom: 24px; }
.hero-state { font-size: 48px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
.hero-state.standby { color: var(--green); text-shadow: 0 0 40px var(--green-glow); }
.hero-state.active { color: var(--red); text-shadow: 0 0 40px var(--red-glow); }
.hero-sub { color: var(--text-dim); margin-top: 8px; font-size: 14px; }

.voters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.voter-card { padding: 20px; cursor: pointer; }
.voter-name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
.voter-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.voter-status.up { background: var(--green-glow); color: var(--green); }
.voter-status.down { background: var(--red-glow); color: var(--red); }
.voter-status.stale { background: var(--yellow-glow); color: var(--yellow); }
.voter-time { color: var(--text-dim); font-size: 12px; margin-top: 8px; font-family: var(--mono); }

.quorum-bar { margin-bottom: 24px; }
.quorum-track { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.quorum-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.quorum-fill.ok { background: var(--green); }
.quorum-fill.warn { background: var(--yellow); }
.quorum-fill.fail { background: var(--red); }

.section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title .actions { margin-left: auto; }

.transitions-list { display: flex; flex-direction: column; gap: 8px; }
.transition-item { display: flex; align-items: center; gap: 16px; padding: 12px 16px; font-size: 13px; }
.transition-time { color: var(--text-dim); font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.transition-arrow { color: var(--accent); font-weight: 700; }

.scopes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
.scope-card { cursor: pointer; position: relative; }
.scope-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.scope-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.scope-range { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.scope-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-top: 12px; }
.scope-badge.enabled { background: var(--green-glow); color: var(--green); }
.scope-badge.disabled { background: var(--red-glow); color: var(--red); }
.scope-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
.scope-card:hover .scope-actions { opacity: 1; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); width: 720px; max-width: 92vw; max-height: 85vh; overflow-y: auto; padding: 32px; position: relative; transform: scale(0.95) translateY(12px); transition: transform 0.25s ease; box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05); }
.modal-overlay.open .modal { transform: scale(1) translateY(0); }
.modal-close { position: absolute; top: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; z-index: 1; }
.modal-close:hover { background: var(--surface-hover); }
.modal h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; padding-right: 48px; }
.modal h3 { font-size: 15px; font-weight: 600; margin: 20px 0 10px; color: var(--accent); }

.voter-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.voter-detail-item { padding: 12px 16px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
td.mono { font-family: var(--mono); font-size: 12px; }

.btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.btn:hover { background: var(--surface-hover); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-danger { background: var(--red); border-color: var(--red); color: white; }
.btn-success { background: var(--green); border-color: var(--green); color: white; }
.btn-warning { background: var(--yellow); border-color: var(--yellow); color: #1a1a2e; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { color: var(--text); background: var(--surface); }
.btn-icon { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }

.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-field { flex: 1; }
.form-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.form-field input, .form-field select {
  width: 100%; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: var(--mono); font-size: 13px;
}
.form-field input:focus, .form-field select:focus { outline: none; border-color: var(--accent); }
.form-field input::placeholder { color: var(--text-dim); opacity: 0.5; }
.form-field select option { background: var(--bg); color: var(--text); }

.lease-type { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; }
.lease-type.dynamic { background: rgba(99,102,241,0.15); color: var(--accent); }
.lease-type.reserved { background: var(--green-glow); color: var(--green); }
.lease-type.static { background: var(--yellow-glow); color: var(--yellow); }

.config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.config-item { padding: 16px; }
.config-value { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.config-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

.empty { text-align: center; padding: 48px; color: var(--text-dim); }

.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.toggle-track { width: 40px; height: 22px; border-radius: 11px; background: var(--surface); border: 1px solid var(--border); position: relative; transition: background 0.2s; }
.toggle-track.on { background: var(--green-glow); border-color: var(--green); }
.toggle-knob { width: 16px; height: 16px; border-radius: 50%; background: var(--text-dim); position: absolute; top: 2px; left: 2px; transition: all 0.2s; }
.toggle-track.on .toggle-knob { left: 20px; background: var(--green); }

/* Tabs inside modal */
.modal-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: -1px; }
.modal-tab { padding: 8px 16px; border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.modal-tab:hover { color: var(--text); }
.modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Toast */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column-reverse; gap: 8px; }
.toast { padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 500; backdrop-filter: blur(var(--blur)); border: 1px solid var(--border); animation: toast-in 0.3s ease; max-width: 360px; }
.toast.success { background: var(--green-glow); color: var(--green); border-color: rgba(34,197,94,0.2); }
.toast.error { background: var(--red-glow); color: var(--red); border-color: rgba(239,68,68,0.2); }
.toast.info { background: rgba(99,102,241,0.15); color: var(--accent); border-color: rgba(99,102,241,0.2); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.confirm-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
.confirm-message { font-size: 15px; line-height: 1.6; color: var(--text-dim); }

.modal::-webkit-scrollbar { width: 6px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.inline-edit { display: flex; align-items: center; gap: 8px; }
.inline-edit .config-value { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.inline-edit .config-value:hover { background: var(--surface-hover); }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div id="app" class="app">
  <nav class="nav">
    <span class="nav-brand">◆ Tessera</span>
    <div class="nav-tabs">
      <button class="nav-tab" :class="{active: view==='failover'}" @click="view='failover'">Failover</button>
      <button class="nav-tab" :class="{active: view==='dhcp'}" @click="view='dhcp'; loadScopes()">DHCP Management</button>
    </div>
  </nav>

  <!-- FAILOVER VIEW -->
  <template v-if="view==='failover'">
    <div class="hero card">
      <div class="hero-state" :class="failover.state">{{ failover.state || 'loading' }}</div>
      <div class="hero-sub">{{ failover.active_votes || 0 }} active votes · quorum {{ failover.has_quorum ? 'met' : 'not met' }}</div>
    </div>

    <div class="metrics-bar">
      <div class="card metric">
        <div class="metric-value" style="color:var(--green)">{{ failover.up_count || 0 }}</div>
        <div class="metric-label">Up Votes</div>
      </div>
      <div class="card metric">
        <div class="metric-value" style="color:var(--red)">{{ failover.down_count || 0 }}</div>
        <div class="metric-label">Down Votes</div>
      </div>
      <div class="card metric">
        <div class="metric-value">{{ failover.consecutive_down || 0 }}</div>
        <div class="metric-label">Consec. Down</div>
      </div>
      <div class="card metric">
        <div class="metric-value">{{ failover.consecutive_up || 0 }}</div>
        <div class="metric-label">Consec. Up</div>
      </div>
    </div>

    <div class="section-title">🗳️ Voters</div>
    <div class="voters-grid">
      <div v-for="(v, name) in failover.voters" :key="name" class="card voter-card" @click="openVoterDetail(name, v)">
        <div class="voter-name">{{ name }}</div>
        <span class="voter-status" :class="voterClass(v)">{{ v.status }}</span>
        <div class="voter-time">{{ timeAgo(v.received_at) }}</div>
      </div>
      <div v-if="!failover.voters || Object.keys(failover.voters).length===0" class="card empty">No votes yet</div>
    </div>

    <div class="section-title">📊 Quorum Progress</div>
    <div class="card quorum-bar" style="margin-bottom:24px;padding:20px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;color:var(--text-dim)">{{ failover.active_votes || 0 }} / {{ failover.config?.quorum || '?' }} required</span>
        <span style="font-size:13px;color:var(--text-dim)">{{ failover.has_quorum ? '✅ Quorum' : '⏳ Waiting' }}</span>
      </div>
      <div class="quorum-track">
        <div class="quorum-fill" :class="quorumClass" :style="{width: quorumPct + '%'}"></div>
      </div>
    </div>

    <div v-if="failover.transitions && failover.transitions.length" style="margin-bottom:24px">
      <div class="section-title">🔄 Transition Log</div>
      <div class="card transitions-list">
        <div v-for="t in failover.transitions" :key="t.timestamp" class="transition-item">
          <span class="transition-time">{{ formatTime(t.timestamp) }}</span>
          <span class="voter-status" :class="t.from_state">{{ t.from_state }}</span>
          <span class="transition-arrow">→</span>
          <span class="voter-status" :class="t.to_state">{{ t.to_state }}</span>
          <span style="color:var(--text-dim);font-size:12px">{{ t.reason }}</span>
        </div>
      </div>
    </div>

    <div v-if="failover.config" style="margin-bottom:24px">
      <div class="section-title">⚙️ Configuration</div>
      <div class="config-grid">
        <div class="card config-item"><div class="config-value">{{ failover.config.quorum }}</div><div class="config-label">Quorum Threshold</div></div>
        <div class="card config-item"><div class="config-value">{{ failover.config.failover_rounds }}</div><div class="config-label">Failover Rounds</div></div>
        <div class="card config-item"><div class="config-value">{{ failover.config.failback_rounds }}</div><div class="config-label">Failback Rounds</div></div>
        <div class="card config-item"><div class="config-value">{{ failover.config.vote_ttl }}s</div><div class="config-label">Vote TTL</div></div>
      </div>
    </div>
  </template>

  <!-- DHCP MANAGEMENT VIEW -->
  <template v-if="view==='dhcp'">
    <div class="metrics-bar">
      <div class="card metric"><div class="metric-value" style="color:var(--accent)">{{ scopes.length }}</div><div class="metric-label">Total Scopes</div></div>
      <div class="card metric"><div class="metric-value" style="color:var(--green)">{{ enabledCount }}</div><div class="metric-label">Enabled</div></div>
      <div class="card metric"><div class="metric-value" style="color:var(--red)">{{ scopes.length - enabledCount }}</div><div class="metric-label">Disabled</div></div>
    </div>

    <div class="section-title">
      📡 DHCP Scopes
      <div class="actions"><button class="btn btn-primary" @click="openCreateScope">+ New Scope</button></div>
    </div>
    <div class="scopes-grid">
      <div v-for="s in scopes" :key="s.name" class="card scope-card" @click="openScope(s.name)">
        <div class="scope-actions" @click.stop>
          <button class="btn btn-sm" :class="s.enabled ? 'btn-warning' : 'btn-success'" @click="toggleScope(s)">{{ s.enabled ? 'Disable' : 'Enable' }}</button>
          <button class="btn btn-sm btn-danger btn-icon" @click="confirmDeleteScope(s)">🗑</button>
        </div>
        <div class="scope-name">{{ s.name }}</div>
        <div class="scope-range">{{ s.start_address }} — {{ s.end_address }}</div>
        <div class="scope-range">{{ s.subnet_mask }}</div>
        <span class="scope-badge" :class="s.enabled?'enabled':'disabled'">{{ s.enabled?'Enabled':'Disabled' }}</span>
      </div>
    </div>
    <div v-if="scopes.length===0" class="card empty">No scopes found</div>
  </template>

  <!-- SCOPE DETAIL MODAL -->
  <div class="modal-overlay" :class="{open: modal==='scope'}" @click.self="closeModal">
    <div class="modal">
      <button class="modal-close" @click="closeModal">✕</button>
      <template v-if="scopeDetail">
        <h2>{{ selectedScope }}</h2>

        <div class="modal-tabs">
          <button class="modal-tab" :class="{active: scopeTab==='overview'}" @click="scopeTab='overview'">Overview</button>
          <button class="modal-tab" :class="{active: scopeTab==='settings'}" @click="scopeTab='settings'">Settings</button>
          <button class="modal-tab" :class="{active: scopeTab==='reservations'}" @click="scopeTab='reservations'">Reservations ({{ reservations.length }})</button>
          <button class="modal-tab" :class="{active: scopeTab==='leases'}" @click="scopeTab='leases'">Leases ({{ scopeLeases.length }})</button>
        </div>

        <!-- Overview tab -->
        <div v-if="scopeTab==='overview'">
          <h3>Network Configuration</h3>
          <div class="card" style="margin-bottom:16px">
            <table>
              <tr v-for="(v,k) in networkConfig" :key="k">
                <td style="color:var(--text-dim);width:40%">{{ k }}</td>
                <td class="mono">{{ v }}</td>
              </tr>
            </table>
          </div>

          <h3>Lease Settings</h3>
          <div class="card" style="margin-bottom:16px">
            <table>
              <tr v-for="(v,k) in leaseSettings" :key="k">
                <td style="color:var(--text-dim);width:40%">{{ k }}</td>
                <td class="mono">{{ v }}</td>
              </tr>
            </table>
          </div>

          <div v-if="bootConfig && Object.keys(bootConfig).length">
            <h3>PXE / Boot</h3>
            <div class="card">
              <table>
                <tr v-for="(v,k) in bootConfig" :key="k">
                  <td style="color:var(--text-dim);width:40%">{{ k }}</td>
                  <td class="mono">{{ v }}</td>
                </tr>
              </table>
            </div>
          </div>
        </div>

        <!-- Settings tab -->
        <div v-if="scopeTab==='settings'">
          <h3>Edit Scope Settings</h3>
          <div class="card" style="margin-bottom:16px">
            <div class="form-row">
              <div class="form-field"><label>Start Address</label><input v-model="editScope.startingAddress"></div>
              <div class="form-field"><label>End Address</label><input v-model="editScope.endingAddress"></div>
            </div>
            <div class="form-row">
              <div class="form-field"><label>Subnet Mask</label><input v-model="editScope.subnetMask"></div>
              <div class="form-field"><label>Router / Gateway</label><input v-model="editScope.routerAddress"></div>
            </div>
            <div class="form-row">
              <div class="form-field"><label>Domain Name</label><input v-model="editScope.domainName"></div>
              <div class="form-field"><label>DNS Servers (comma-sep)</label><input v-model="editScope.dnsServers"></div>
            </div>
            <h3>Lease Time</h3>
            <div class="form-row">
              <div class="form-field"><label>Days</label><input type="number" min="0" v-model.number="editScope.leaseTimeDays"></div>
              <div class="form-field"><label>Hours</label><input type="number" min="0" max="23" v-model.number="editScope.leaseTimeHours"></div>
              <div class="form-field"><label>Minutes</label><input type="number" min="0" max="59" v-model.number="editScope.leaseTimeMinutes"></div>
            </div>
            <h3>Options</h3>
            <div class="form-row">
              <div class="form-field">
                <div class="toggle" @click="editScope.pingCheckEnabled = !editScope.pingCheckEnabled">
                  <div class="toggle-track" :class="{on: editScope.pingCheckEnabled}"><div class="toggle-knob"></div></div>
                  <span>Ping Check</span>
                </div>
              </div>
              <div class="form-field">
                <div class="toggle" @click="editScope.allowOnlyReservedLeases = !editScope.allowOnlyReservedLeases">
                  <div class="toggle-track" :class="{on: editScope.allowOnlyReservedLeases}"><div class="toggle-knob"></div></div>
                  <span>Reserved Only</span>
                </div>
              </div>
              <div class="form-field">
                <div class="toggle" @click="editScope.dnsUpdates = !editScope.dnsUpdates">
                  <div class="toggle-track" :class="{on: editScope.dnsUpdates}"><div class="toggle-knob"></div></div>
                  <span>DNS Updates</span>
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <div class="toggle" @click="editScope.ignoreClientIdentifierOption = !editScope.ignoreClientIdentifierOption">
                  <div class="toggle-track" :class="{on: editScope.ignoreClientIdentifierOption}"><div class="toggle-knob"></div></div>
                  <span>Ignore Client ID</span>
                </div>
              </div>
              <div class="form-field">
                <div class="toggle" @click="editScope.blockLocallyAdministeredMacAddresses = !editScope.blockLocallyAdministeredMacAddresses">
                  <div class="toggle-track" :class="{on: editScope.blockLocallyAdministeredMacAddresses}"><div class="toggle-knob"></div></div>
                  <span>Block Random MACs</span>
                </div>
              </div>
            </div>
            <h3>PXE / Boot</h3>
            <div class="form-row">
              <div class="form-field"><label>Boot Filename</label><input v-model="editScope.bootFileName"></div>
              <div class="form-field"><label>Server Hostname</label><input v-model="editScope.serverHostName"></div>
            </div>
            <div class="form-row">
              <div class="form-field"><label>TFTP Servers (comma-sep)</label><input v-model="editScope.tftpServerAddresses"></div>
              <div class="form-field"><label>Offer Delay (ms)</label><input type="number" min="0" v-model.number="editScope.offerDelayTime"></div>
            </div>
            <div style="margin-top:16px;display:flex;gap:12px">
              <button class="btn btn-primary" @click="saveScope" :disabled="saving">{{ saving ? 'Saving…' : 'Save Changes' }}</button>
              <button class="btn btn-ghost" @click="populateEditScope">Reset</button>
            </div>
          </div>
        </div>

        <!-- Reservations tab -->
        <div v-if="scopeTab==='reservations'">
          <div class="card" style="overflow-x:auto;margin-bottom:16px">
            <table>
              <thead><tr><th>Host</th><th>IP</th><th>MAC</th><th>Notes</th><th></th></tr></thead>
              <tbody>
                <tr v-for="r in reservations" :key="r.hardwareAddress">
                  <td>{{ r.hostName || '—' }}</td>
                  <td class="mono">{{ r.address }}</td>
                  <td class="mono">{{ r.hardwareAddress }}</td>
                  <td>{{ r.comments || '—' }}</td>
                  <td><button class="btn btn-danger btn-sm" @click="confirmDeleteReservation(r)">✕</button></td>
                </tr>
                <tr v-if="reservations.length===0"><td colspan="5" style="text-align:center;color:var(--text-dim)">No reservations</td></tr>
              </tbody>
            </table>
          </div>
          <h3>Add Reservation</h3>
          <div class="card">
            <div class="form-row">
              <div class="form-field"><label>MAC</label><input v-model="newRes.mac" placeholder="AA:BB:CC:DD:EE:FF" @keydown.enter="addReservation"></div>
              <div class="form-field"><label>IP</label><input v-model="newRes.ip" placeholder="192.0.2.x" @keydown.enter="addReservation"></div>
              <div class="form-field"><label>Host</label><input v-model="newRes.host" placeholder="hostname" @keydown.enter="addReservation"></div>
              <div class="form-field"><label>Notes</label><input v-model="newRes.comments" placeholder="optional" @keydown.enter="addReservation"></div>
            </div>
            <button class="btn btn-primary" @click="addReservation" :disabled="!newRes.mac || !newRes.ip">Add Reservation</button>
          </div>
        </div>

        <!-- Leases tab -->
        <div v-if="scopeTab==='leases'">
          <div class="card" style="overflow-x:auto">
            <table>
              <thead><tr><th>Address</th><th>MAC</th><th>Host</th><th>Type</th><th>Expires</th><th></th></tr></thead>
              <tbody>
                <tr v-for="l in scopeLeases" :key="l.address">
                  <td class="mono">{{ l.address }}</td>
                  <td class="mono">{{ l.hardwareAddress || '—' }}</td>
                  <td>{{ l.hostName || '—' }}</td>
                  <td><span class="lease-type" :class="(l.type||'').toLowerCase()">{{ l.type || 'Unknown' }}</span></td>
                  <td class="mono">{{ l.expires || '—' }}</td>
                  <td>
                    <button v-if="(l.type||'').toLowerCase()==='dynamic'" class="btn btn-sm btn-success" @click="convertLease(l)" title="Convert to reservation">⇄</button>
                    <button class="btn btn-sm btn-danger" @click="confirmRemoveLease(l)" title="Remove lease">✕</button>
                  </td>
                </tr>
                <tr v-if="scopeLeases.length===0"><td colspan="6" style="text-align:center;color:var(--text-dim)">No active leases</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- CREATE SCOPE MODAL -->
  <div class="modal-overlay" :class="{open: modal==='create-scope'}" @click.self="closeModal">
    <div class="modal" style="width:600px">
      <button class="modal-close" @click="closeModal">✕</button>
      <h2>Create DHCP Scope</h2>
      <div class="form-row">
        <div class="form-field"><label>Scope Name</label><input v-model="createForm.name" placeholder="My Scope"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Start Address</label><input v-model="createForm.starting_address" placeholder="192.0.2.100"></div>
        <div class="form-field"><label>End Address</label><input v-model="createForm.ending_address" placeholder="192.0.2.254"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Subnet Mask</label><input v-model="createForm.subnet_mask" placeholder="255.255.255.0"></div>
        <div class="form-field"><label>Gateway</label><input v-model="createForm.router_address" placeholder="192.0.2.100"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Domain</label><input v-model="createForm.domain_name" placeholder="example.com"></div>
        <div class="form-field"><label>DNS Servers (comma-sep)</label><input v-model="createForm.dns_servers_str" placeholder="192.0.2.1, 192.0.2.2"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Lease Days</label><input type="number" min="0" v-model.number="createForm.lease_time_days"></div>
        <div class="form-field"><label>Hours</label><input type="number" min="0" max="23" v-model.number="createForm.lease_time_hours"></div>
        <div class="form-field"><label>Minutes</label><input type="number" min="0" max="59" v-model.number="createForm.lease_time_minutes"></div>
      </div>
      <div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-ghost" @click="closeModal">Cancel</button>
        <button class="btn btn-primary" @click="createScope" :disabled="!createForm.name || !createForm.starting_address || !createForm.ending_address || !createForm.subnet_mask">Create Scope</button>
      </div>
    </div>
  </div>

  <!-- VOTER DETAIL MODAL -->
  <div class="modal-overlay" :class="{open: modal==='voter'}" @click.self="closeModal">
    <div class="modal" style="width:520px">
      <button class="modal-close" @click="closeModal">✕</button>
      <template v-if="voterDetail">
        <h2>{{ voterDetail.name }}</h2>
        <div class="voter-detail-grid">
          <div class="card voter-detail-item"><div class="config-label">Status</div><span class="voter-status" :class="voterClass(voterDetail)" style="margin-top:4px">{{ voterDetail.status }}</span></div>
          <div class="card voter-detail-item"><div class="config-label">Last Seen</div><div class="config-value" style="margin-top:4px">{{ timeAgo(voterDetail.received_at) }}</div></div>
          <div class="card voter-detail-item"><div class="config-label">Received At</div><div class="config-value" style="margin-top:4px;font-size:12px">{{ formatTime(voterDetail.received_at) }}</div></div>
          <div class="card voter-detail-item"><div class="config-label">Stale</div><div class="config-value" style="margin-top:4px">{{ voterDetail.stale ? 'Yes' : 'No' }}</div></div>
        </div>
      </template>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal-overlay" :class="{open: modal==='confirm'}" @click.self="cancelConfirm">
    <div class="modal" style="width:460px">
      <button class="modal-close" @click="cancelConfirm">✕</button>
      <h2>{{ confirmTitle }}</h2>
      <div class="confirm-message">{{ confirmMessage }}</div>
      <div class="confirm-actions">
        <button class="btn btn-ghost" @click="cancelConfirm">Cancel</button>
        <button class="btn btn-danger" @click="executeConfirm">{{ confirmActionLabel }}</button>
      </div>
    </div>
  </div>

  <div class="toast-container">
    <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">{{ t.message }}</div>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;

createApp({
  setup() {
    const view = ref('failover');
    const failover = ref({});
    const scopes = ref([]);
    const modal = ref(null);
    const previousModal = ref(null);
    const scopeTab = ref('overview');
    const selectedScope = ref('');
    const scopeDetail = ref(null);
    const scopeLeases = ref([]);
    const voterDetail = ref(null);
    const newRes = reactive({ mac: '', ip: '', host: '', comments: '' });
    const toasts = ref([]);
    const saving = ref(false);
    let statusInterval = null;

    // Edit scope form
    const editScope = reactive({
      startingAddress: '', endingAddress: '', subnetMask: '', routerAddress: '',
      domainName: '', dnsServers: '', leaseTimeDays: 0, leaseTimeHours: 0, leaseTimeMinutes: 0,
      pingCheckEnabled: true, allowOnlyReservedLeases: false, dnsUpdates: true,
      ignoreClientIdentifierOption: false, blockLocallyAdministeredMacAddresses: false,
      bootFileName: '', serverHostName: '', tftpServerAddresses: '', offerDelayTime: 0,
    });

    // Create scope form
    const createForm = reactive({
      name: '', starting_address: '', ending_address: '', subnet_mask: '255.255.0.0',
      router_address: '', domain_name: '', dns_servers_str: '', lease_time_days: 1,
      lease_time_hours: 0, lease_time_minutes: 0,
    });

    // Confirm dialog
    const confirmTitle = ref('');
    const confirmMessage = ref('');
    const confirmActionLabel = ref('Delete');
    let confirmCallback = null;

    const enabledCount = computed(() => scopes.value.filter(s => s.enabled).length);
    const reservations = computed(() => scopeDetail.value?.reservedLeases || []);

    const networkConfig = computed(() => {
      if (!scopeDetail.value) return {};
      const d = scopeDetail.value;
      const cfg = {};
      if (d.startingAddress) cfg['Start Address'] = d.startingAddress;
      if (d.endingAddress) cfg['End Address'] = d.endingAddress;
      if (d.subnetMask) cfg['Subnet Mask'] = d.subnetMask;
      if (d.routerAddress) cfg['Gateway'] = d.routerAddress;
      if (d.domainName) cfg['Domain'] = d.domainName;
      if (d.dnsServers) cfg['DNS Servers'] = Array.isArray(d.dnsServers) ? d.dnsServers.join(', ') : d.dnsServers;
      if (d.serverAddress) cfg['Server Address'] = d.serverAddress;
      return cfg;
    });

    const leaseSettings = computed(() => {
      if (!scopeDetail.value) return {};
      const d = scopeDetail.value;
      const cfg = {};
      const days = d.leaseTimeDays || 0, hrs = d.leaseTimeHours || 0, mins = d.leaseTimeMinutes || 0;
      if (days || hrs || mins) cfg['Lease Duration'] = [days && `${days}d`, hrs && `${hrs}h`, mins && `${mins}m`].filter(Boolean).join(' ');
      if (d.pingCheckEnabled !== undefined) cfg['Ping Check'] = d.pingCheckEnabled ? 'Yes' : 'No';
      if (d.allowOnlyReservedLeases !== undefined) cfg['Reserved Only'] = d.allowOnlyReservedLeases ? 'Yes' : 'No';
      if (d.dnsUpdates !== undefined) cfg['DNS Updates'] = d.dnsUpdates ? 'Yes' : 'No';
      if (d.ignoreClientIdentifierOption !== undefined) cfg['Ignore Client ID'] = d.ignoreClientIdentifierOption ? 'Yes' : 'No';
      if (d.blockLocallyAdministeredMacAddresses !== undefined) cfg['Block Random MACs'] = d.blockLocallyAdministeredMacAddresses ? 'Yes' : 'No';
      if (d.offerDelayTime !== undefined) cfg['Offer Delay'] = `${d.offerDelayTime}ms`;
      if (d.dnsTtl !== undefined) cfg['DNS TTL'] = `${d.dnsTtl}s`;
      return cfg;
    });

    const bootConfig = computed(() => {
      if (!scopeDetail.value) return {};
      const d = scopeDetail.value;
      const cfg = {};
      if (d.bootFileName) cfg['Boot File'] = d.bootFileName;
      if (d.serverHostName) cfg['Server Hostname'] = d.serverHostName;
      if (d.tftpServerAddresses?.length) cfg['TFTP Servers'] = d.tftpServerAddresses.join(', ');
      return cfg;
    });

    const quorumPct = computed(() => {
      const q = failover.value.config?.quorum || 1;
      return Math.min(100, ((failover.value.active_votes || 0) / q) * 100);
    });
    const quorumClass = computed(() => failover.value.has_quorum ? 'ok' : quorumPct.value > 50 ? 'warn' : 'fail');

    function toast(message, type = 'info') {
      const id = Date.now() + Math.random();
      toasts.value.push({ id, message, type });
      setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 4000);
    }

    function closeModal() { modal.value = null; previousModal.value = null; }

    function showConfirm(title, message, action, callback) {
      confirmTitle.value = title;
      confirmMessage.value = message;
      confirmActionLabel.value = action;
      previousModal.value = modal.value;
      confirmCallback = callback;
      modal.value = 'confirm';
    }

    function cancelConfirm() { modal.value = previousModal.value || null; previousModal.value = null; confirmCallback = null; }
    function executeConfirm() { if (confirmCallback) confirmCallback(); confirmCallback = null; }

    function openVoterDetail(name, v) { voterDetail.value = { name, ...v }; modal.value = 'voter'; }

    async function loadStatus() {
      try { const r = await fetch('/api/v1/status'); if (r.ok) failover.value = await r.json(); } catch(e) {}
    }

    async function loadScopes() {
      try {
        const r = await fetch('/api/v1/scopes');
        if (r.ok) { const d = await r.json(); scopes.value = d.scopes || []; }
      } catch(e) { toast('Failed to load scopes', 'error'); }
    }

    async function openScope(name) {
      selectedScope.value = name;
      scopeDetail.value = null;
      scopeLeases.value = [];
      scopeTab.value = 'overview';
      modal.value = 'scope';
      await refreshScopeDetail();
    }

    function populateEditScope() {
      const d = scopeDetail.value;
      if (!d) return;
      editScope.startingAddress = d.startingAddress || '';
      editScope.endingAddress = d.endingAddress || '';
      editScope.subnetMask = d.subnetMask || '';
      editScope.routerAddress = d.routerAddress || '';
      editScope.domainName = d.domainName || '';
      editScope.dnsServers = Array.isArray(d.dnsServers) ? d.dnsServers.join(', ') : (d.dnsServers || '');
      editScope.leaseTimeDays = d.leaseTimeDays || 0;
      editScope.leaseTimeHours = d.leaseTimeHours || 0;
      editScope.leaseTimeMinutes = d.leaseTimeMinutes || 0;
      editScope.pingCheckEnabled = d.pingCheckEnabled ?? true;
      editScope.allowOnlyReservedLeases = d.allowOnlyReservedLeases ?? false;
      editScope.dnsUpdates = d.dnsUpdates ?? true;
      editScope.ignoreClientIdentifierOption = d.ignoreClientIdentifierOption ?? false;
      editScope.blockLocallyAdministeredMacAddresses = d.blockLocallyAdministeredMacAddresses ?? false;
      editScope.bootFileName = d.bootFileName || '';
      editScope.serverHostName = d.serverHostName || '';
      editScope.tftpServerAddresses = Array.isArray(d.tftpServerAddresses) ? d.tftpServerAddresses.join(', ') : '';
      editScope.offerDelayTime = d.offerDelayTime || 0;
    }

    async function saveScope() {
      saving.value = true;
      try {
        const settings = {
          startingAddress: editScope.startingAddress,
          endingAddress: editScope.endingAddress,
          subnetMask: editScope.subnetMask,
          routerAddress: editScope.routerAddress,
          domainName: editScope.domainName,
          dnsServers: editScope.dnsServers,
          leaseTimeDays: String(editScope.leaseTimeDays),
          leaseTimeHours: String(editScope.leaseTimeHours),
          leaseTimeMinutes: String(editScope.leaseTimeMinutes),
          pingCheckEnabled: String(editScope.pingCheckEnabled),
          allowOnlyReservedLeases: String(editScope.allowOnlyReservedLeases),
          dnsUpdates: String(editScope.dnsUpdates),
          ignoreClientIdentifierOption: String(editScope.ignoreClientIdentifierOption),
          blockLocallyAdministeredMacAddresses: String(editScope.blockLocallyAdministeredMacAddresses),
          bootFileName: editScope.bootFileName,
          serverHostName: editScope.serverHostName,
          tftpServerAddresses: editScope.tftpServerAddresses,
          offerDelayTime: String(editScope.offerDelayTime),
        };
        const r = await fetch(`/api/v1/scopes/${encodeURIComponent(selectedScope.value)}`, {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ settings })
        });
        if (r.ok) { toast('Scope settings saved', 'success'); await refreshScopeDetail(); }
        else { const e = await r.json().catch(()=>({})); toast(e.detail || 'Save failed', 'error'); }
      } catch(e) { toast('Save failed', 'error'); }
      saving.value = false;
    }

    function openCreateScope() {
      Object.assign(createForm, {
        name: '', starting_address: '', ending_address: '', subnet_mask: '255.255.0.0',
        router_address: '', domain_name: '', dns_servers_str: '', lease_time_days: 1,
        lease_time_hours: 0, lease_time_minutes: 0,
      });
      modal.value = 'create-scope';
    }

    async function createScope() {
      const body = {
        name: createForm.name,
        starting_address: createForm.starting_address,
        ending_address: createForm.ending_address,
        subnet_mask: createForm.subnet_mask,
        router_address: createForm.router_address,
        domain_name: createForm.domain_name,
        dns_servers: createForm.dns_servers_str ? createForm.dns_servers_str.split(',').map(s => s.trim()).filter(Boolean) : [],
        lease_time_days: createForm.lease_time_days || null,
        lease_time_hours: createForm.lease_time_hours || null,
        lease_time_minutes: createForm.lease_time_minutes || null,
      };
      try {
        const r = await fetch('/api/v1/scopes', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        if (r.ok) { toast(`Scope '${body.name}' created`, 'success'); closeModal(); await loadScopes(); }
        else { const e = await r.json().catch(()=>({})); toast(e.detail || 'Create failed', 'error'); }
      } catch(e) { toast('Create failed', 'error'); }
    }

    async function toggleScope(s) {
      const action = s.enabled ? 'disable' : 'enable';
      try {
        const r = await fetch(`/api/v1/scopes/${encodeURIComponent(s.name)}/${action}`, { method: 'POST' });
        if (r.ok) { toast(`Scope ${action}d`, 'success'); await loadScopes(); }
        else { const e = await r.json().catch(()=>({})); toast(e.detail || `Failed to ${action}`, 'error'); }
      } catch(e) { toast(`Failed to ${action}`, 'error'); }
    }

    function confirmDeleteScope(s) {
      showConfirm('Delete Scope', `Permanently delete scope "${s.name}"? This removes all reservations and settings.`, 'Delete', async () => {
        try {
          const r = await fetch(`/api/v1/scopes/${encodeURIComponent(s.name)}`, { method: 'DELETE' });
          if (r.ok) { toast(`Scope '${s.name}' deleted`, 'success'); closeModal(); await loadScopes(); }
          else { const e = await r.json().catch(()=>({})); toast(e.detail || 'Delete failed', 'error'); modal.value = previousModal.value; }
        } catch(e) { toast('Delete failed', 'error'); modal.value = previousModal.value; }
      });
    }

    async function addReservation() {
      if (!newRes.mac || !newRes.ip) return;
      try {
        const r = await fetch(`/api/v1/scopes/${encodeURIComponent(selectedScope.value)}/reservations`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ hardware_address: newRes.mac, address: newRes.ip, host_name: newRes.host, comments: newRes.comments })
        });
        if (r.ok) { toast(`Reservation added: ${newRes.ip}`, 'success'); newRes.mac=''; newRes.ip=''; newRes.host=''; newRes.comments=''; await refreshScopeDetail(); }
        else { const e = await r.json().catch(()=>({})); toast(e.detail || 'Failed', 'error'); }
      } catch(e) { toast('Failed to add', 'error'); }
    }

    function confirmDeleteReservation(r) {
      showConfirm('Delete Reservation', `Remove reservation for ${r.hostName || r.hardwareAddress}? (${r.address})`, 'Delete', async () => {
        try {
          const res = await fetch(`/api/v1/scopes/${encodeURIComponent(selectedScope.value)}/reservations/${encodeURIComponent(r.hardwareAddress)}`, { method: 'DELETE' });
          if (res.ok) { toast(`Removed: ${r.address}`, 'success'); modal.value = 'scope'; await refreshScopeDetail(); }
          else { const e = await res.json().catch(()=>({})); toast(e.detail || 'Failed', 'error'); modal.value = 'scope'; }
        } catch(e) { toast('Failed', 'error'); modal.value = 'scope'; }
      });
    }

    function confirmRemoveLease(l) {
      showConfirm('Remove Lease', `Remove lease for ${l.address} (${l.hostName || l.hardwareAddress || 'unknown'})?`, 'Remove', async () => {
        try {
          const res = await fetch(`/api/v1/leases/${encodeURIComponent(selectedScope.value)}/${encodeURIComponent(l.address)}`, { method: 'DELETE' });
          if (res.ok) { toast(`Lease removed: ${l.address}`, 'success'); modal.value = 'scope'; await refreshScopeDetail(); }
          else { const e = await res.json().catch(()=>({})); toast(e.detail || 'Failed', 'error'); modal.value = 'scope'; }
        } catch(e) { toast('Failed', 'error'); modal.value = 'scope'; }
      });
    }

    async function convertLease(l) {
      try {
        const r = await fetch(`/api/v1/leases/${encodeURIComponent(selectedScope.value)}/${encodeURIComponent(l.address)}/convert`, { method: 'POST' });
        if (r.ok) { toast(`Converted ${l.address} to reservation`, 'success'); await refreshScopeDetail(); }
        else { const e = await r.json().catch(()=>({})); toast(e.detail || 'Failed', 'error'); }
      } catch(e) { toast('Failed', 'error'); }
    }

    async function refreshScopeDetail() {
      if (!selectedScope.value) return;
      try {
        const [dr, lr] = await Promise.all([
          fetch(`/api/v1/scopes/${encodeURIComponent(selectedScope.value)}`),
          fetch(`/api/v1/leases/${encodeURIComponent(selectedScope.value)}`)
        ]);
        if (dr.ok) { const d = await dr.json(); scopeDetail.value = d.data || d; populateEditScope(); }
        if (lr.ok) { const l = await lr.json(); scopeLeases.value = l.leases || []; }
      } catch(e) {}
    }

    function voterClass(v) {
      if (!v.received_at) return 'stale';
      return (Date.now()/1000 - v.received_at > 120) ? 'stale' : v.status;
    }
    function timeAgo(ts) {
      if (!ts) return '—';
      const s = Math.floor(Date.now()/1000 - ts);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s/60)}m ago`;
      return `${Math.floor(s/3600)}h ago`;
    }
    function formatTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : '—'; }

    function onKeydown(e) {
      if (e.key === 'Escape' && modal.value) {
        if (modal.value === 'confirm') cancelConfirm();
        else closeModal();
      }
    }

    onMounted(() => { loadStatus(); statusInterval = setInterval(loadStatus, 5000); document.addEventListener('keydown', onKeydown); });
    onUnmounted(() => { if (statusInterval) clearInterval(statusInterval); document.removeEventListener('keydown', onKeydown); });

    return {
